<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat + YouTube + HTML Runner</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --border: #374151;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --accent: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr 420px;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 32px);
    }

    .panel {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(31, 41, 55, 0.8);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(15, 23, 42, 0.7);
    }

    .message {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #1f2937;
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .chat-input-wrap {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: rgba(31, 41, 55, 0.8);
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    .send-btn, .run-btn, .load-btn, .video-btn, .search-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .send-btn, .run-btn, .load-btn, .search-btn {
      background: var(--primary);
      color: white;
    }

    .send-btn:hover, .run-btn:hover, .load-btn:hover, .search-btn:hover {
      filter: brightness(1.08);
    }

    .youtube-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .youtube-player {
      flex: 1;
      background: #000;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .youtube-player iframe {
      width: 100%;
      height: 100%;
      min-height: 360px;
      border: 0;
      display: block;
    }

    .video-controls {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: rgba(31, 41, 55, 0.8);
      align-items: center;
      flex-wrap: wrap;
    }

    .video-url {
      flex: 1;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      min-width: 150px;
    }

    .search-container {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    .api-key-setup {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .api-key-input {
      flex: 1;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      font-size: 12px;
    }

    .search-results {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      max-height: 400px;
      overflow-y: auto;
      z-index: 100;
      margin-top: -1px;
    }

    .search-results.active {
      display: block;
    }

    .video-item {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: 0.2s ease;
      background: rgba(15, 23, 42, 0.5);
    }

    .video-item:hover {
      background: rgba(31, 41, 55, 0.8);
    }

    .video-item:last-child {
      border-bottom: none;
    }

    .video-thumbnail {
      width: 60px;
      height: 45px;
      flex-shrink: 0;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-channel {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .runner-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .runner-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(31, 41, 55, 0.8);
    }

    .runner-toolbar input[type="file"] {
      display: none;
    }

    .runner-toolbar label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: #374151;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 12px;
      gap: 10px;
      background: rgba(15, 23, 42, 0.8);
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 200px;
      resize: none;
      background: #020817;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      outline: none;
      font-family: Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    .preview-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      overflow: hidden;
      height: 220px;
      flex-shrink: 0;
    }

    .preview-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .error-message {
      color: var(--danger);
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      border-radius: 6px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      color: var(--accent);
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--accent);
      border-radius: 6px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .relative {
      position: relative;
    }

    .loading {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
      }

      .chat-panel, .youtube-section, .runner-panel {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel chat-panel">
      <div class="panel-header">
        <span>Chat</span>
        <span style="color: var(--muted); font-size: 12px;">Live Demo</span>
      </div>

      <div id="chatMessages" class="chat-messages">
        <div class="message bot">
          Hello! Ask me anything, or type something like "How are you?".
        </div>
      </div>

      <div class="chat-input-wrap">
        <input id="chatInput" class="chat-input" type="text" placeholder="Type a message..." />
        <button id="sendBtn" class="send-btn">Send</button>
      </div>
    </aside>

    <section class="panel youtube-section">
      <div class="panel-header">
        <span>YouTube Player</span>
      </div>

      <div class="youtube-player">
        <iframe
          id="youtubeFrame"
          src="https://www.youtube.com/embed/ysz5S6PUM-U?si=V6A-1K5a2C9mReyB"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <div class="video-controls">
        <div class="api-key-setup">
          <input
            id="apiKeyInput"
            class="api-key-input"
            type="password"
            placeholder="Paste your YouTube API key here"
          />
          <button id="saveApiBtn" class="search-btn" style="padding: 10px 12px; font-size: 12px;">Save Key</button>
        </div>
        <div id="apiMessage" class="error-message"></div>
        <div class="search-container">
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search YouTube videos..."
          />
          <button id="searchBtn" class="search-btn">Search</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </section>

    <aside class="panel runner-panel">
      <div class="panel-header">
        <span>HTML File Runner</span>
      </div>

      <div class="runner-toolbar">
        <input id="fileInput" type="file" accept=".html,.htm" />
        <label for="fileInput">Load HTML File</label>
        <button id="runBtn" class="run-btn">Run</button>
      </div>

      <div class="editor-wrap">
        <textarea id="htmlEditor" spellcheck="false">
<!DOCTYPE html>
<html>
  <body>
    <h1>Hello from the HTML runner!</h1>
    <button onclick="alert('It works!')">Click me</button>
  </body>
</html>
        </textarea>

        <div class="preview-box">
          <iframe id="previewFrame" title="HTML preview"></iframe>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const youtubeFrame = document.getElementById("youtubeFrame");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const searchResults = document.getElementById("searchResults");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveApiBtn = document.getElementById("saveApiBtn");
    const apiMessage = document.getElementById("apiMessage");
    const htmlEditor = document.getElementById("htmlEditor");
    const previewFrame = document.getElementById("previewFrame");
    const fileInput = document.getElementById("fileInput");
    const runBtn = document.getElementById("runBtn");

    let apiKey = localStorage.getItem("youtubeApiKey") || "";

    if (apiKey) {
      apiKeyInput.value = apiKey;
    }

    // Save API Key
    saveApiBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        showApiMessage("Please enter an API key", "error");
        return;
      }
      localStorage.setItem("youtubeApiKey", key);
      apiKey = key;
      showApiMessage("API key saved successfully!", "success");
      setTimeout(() => hideApiMessage(), 3000);
    });

    function showApiMessage(message, type) {
      apiMessage.textContent = message;
      apiMessage.className = `${type}-message show`;
    }

    function hideApiMessage() {
      apiMessage.className = `${apiMessage.className.split(" ")[0]}-message`;
    }

    // YouTube Search
    async function searchYouTube() {
      const query = searchInput.value.trim();
      if (!query) {
        showApiMessage("Please enter a search query", "error");
        return;
      }

      if (!apiKey) {
        showApiMessage("Please set your YouTube API key first", "error");
        return;
      }

      searchBtn.disabled = true;
      searchBtn.classList.add("loading");
      searchResults.innerHTML = "<div style='padding: 12px; text-align: center; color: var(--muted);'>Searching...</div>";
      searchResults.classList.add("active");

      try {
        const response = await fetch(
          `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=10&key=${apiKey}`
        );

        if (!response.ok) {
          throw new Error("API Error: " + response.statusText);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        if (!data.items || data.items.length === 0) {
          searchResults.innerHTML = "<div style='padding: 12px; text-align: center; color: var(--muted);'>No results found</div>";
          return;
        }

        displaySearchResults(data.items);
      } catch (error) {
        showApiMessage("Search failed: " + error.message, "error");
        searchResults.innerHTML = `<div style='padding: 12px; color: var(--danger);'>Error: ${error.message}</div>`;
      } finally {
        searchBtn.disabled = false;
        searchBtn.classList.remove("loading");
      }
    }

    function displaySearchResults(items) {
      searchResults.innerHTML = "";

      items.forEach((item) => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const channel = item.snippet.channelTitle;
        const thumbnail = item.snippet.thumbnails.default.url;

        const div = document.createElement("div");
        div.className = "video-item";
        div.innerHTML = `
          <img src="${thumbnail}" alt="thumbnail" class="video-thumbnail" />
          <div class="video-info">
            <div class="video-title">${title}</div>
            <div class="video-channel">${channel}</div>
          </div>
        `;

        div.addEventListener("click", () => {
          loadVideo(videoId);
          searchResults.classList.remove("active");
        });

        searchResults.appendChild(div);
      });
    }

    function loadVideo(videoId) {
      youtubeFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      searchInput.value = "";
    }

    searchBtn.addEventListener("click", searchYouTube);
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchYouTube();
    });

    // Close search results when clicking outside
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-container") && !e.target.closest("#searchResults")) {
        searchResults.classList.remove("active");
      }
    });

    // Chat logic
    function addMessage(text, type = "bot") {
      const msg = document.createElement("div");
      msg.className = `message ${type}`;
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      chatInput.value = "";

      const botReply = generateBotReply(text);
      setTimeout(() => addMessage(botReply, "bot"), 250);
    }

    function generateBotReply(message) {
      const lower = message.toLowerCase();

      if (lower.includes("hello") || lower.includes("hi")) return "Hi there! How can I help you today?";
      if (lower.includes("youtube")) return "Use the search bar to find YouTube videos!";
      if (lower.includes("api")) return "You can get a YouTube API key from Google Cloud Console.";
      if (lower.includes("html")) return "The HTML runner is ready for local files or custom code.";
      if (lower.includes("search")) return "Enter your search query and click Search to find videos.";
      return "Nice message! This demo chat is active and ready.";
    }

    sendBtn.addEventListener("click", sendChatMessage);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChatMessage();
    });

    // HTML runner logic
    function runHTML() {
      const code = htmlEditor.value;
      const doc = `
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="UTF-8" />
            <style>
              body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: white;
                color: #111827;
                padding: 24px;
              }
              * { box-sizing: border-box; }
            </style>
          </head>
          <body>
            ${code}
          </body>
        </html>
      `;

      previewFrame.srcdoc = doc;
    }

    runBtn.addEventListener("click", runHTML);

    fileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function () {
        htmlEditor.value = reader.result;
        runHTML();
      };
      reader.readAsText(file);
    });

    // Run initial preview on page load
    runHTML();
  </script>
</body>
</html>
